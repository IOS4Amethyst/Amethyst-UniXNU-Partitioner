# Amethyst UniXNU Partitioner - Plan request
# Copy this file to /sdcard/Amethyst-UniXNU-Partitioner/request.conf and edit it.
# The Plan ZIP reads this file; it never prompts interactively.
#
# size_gib is a positive size in GiB. Fractions are allowed only when they
# resolve to whole MiB (for example 0.5, 12.25).
#
# reserve_mib is the space kept inside userdata ABOVE the new unixnu partition.
# sheng keeps its Data store and diagnostic log in the last 1 GiB of userdata,
# so this must cover it or unixnu would overlap them. Default: 1024 (matching
# sheng's kDefaultReserveMiB). Set 0 only if sheng persistence is off.
# The unixnu partition is placed BELOW this reserve, at the tail of userdata.
#
# Put the bundle on an external SD card or /tmp, not on /sdcard or /data.
# Apply unmounts /data and refuses a bundle stored on userdata-backed internal
# storage. The path must be absolute.
mode = plan
size_gib = 16
reserve_mib = 1024
plan_dir = /external_sd/Amethyst-UniXNU-Partitioner/plans/amethyst-1
