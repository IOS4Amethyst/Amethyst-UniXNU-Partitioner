# Amethyst UniXNU Partitioner - Apply request
# Copy this file to /sdcard/Amethyst-UniXNU-Partitioner/request.conf and replace
# every placeholder. The Apply ZIP refuses if any check fails.
#
# The bundle must be on external SD or /tmp, never on /sdcard or /data:
# apply unmounts /data, and the stage log must stay writable until both GPT
# copies are verified.
#
# confirm must be copied exactly from plan.txt / plan.conf:
#   unixnu <plan_id> <hardware_serial> <unixnu_bytes>
#
# acknowledge_data_loss = yes is an explicit acknowledgement that shrinking
# F2FS moves file data, that a GPT backup contains no file contents, and that
# restoring an old GPT cannot undo the F2FS shrink.
mode = apply
plan = /external_sd/Amethyst-UniXNU-Partitioner/plans/amethyst-1
confirm = unixnu REPLACE_PLAN_ID REPLACE_SERIAL REPLACE_BYTES
acknowledge_data_loss = yes

# After rebooting recovery, reuse the Apply ZIP in read-only mode:
# mode = verify
# mode = recover
